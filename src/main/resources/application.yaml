spring:
  application:
    name: mini-banking-api

  datasource:
    url: jdbc:h2:mem:minibanking;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: debug

mvc:
  problemdetails:
    enabled: true