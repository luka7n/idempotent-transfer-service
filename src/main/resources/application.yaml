spring:
  application:
    name: idempotent-transfer-service

  mvc:
    problemdetails:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    tags-sorter: alpha

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: debug

